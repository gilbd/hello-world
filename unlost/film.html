<!doctype html><html><head><meta charset="utf-8"><title>Unlost</title>
<style>
@font-face{font-family:'Gochi';src:url(assets/gochi.woff2) format('woff2')}
@font-face{font-family:'Fredoka';src:url(assets/fredoka.woff2) format('woff2');font-weight:300 700}
html,body{margin:0;background:#111}canvas{display:block;height:100vh;width:auto;margin:0 auto}
</style>
<script src="springs.js"></script></head>
<body><canvas id="c"></canvas><script>
// UNLOST: 30.5 s vertical spot, crayon storybook. Every frame is a pure function of t.
const W=1080,H=1920;
const c=document.getElementById('c');c.width=W;c.height=H;const g=c.getContext('2d');
window.FILM_DURATION=30.5;
window.CUTS=[3.6,6,9,13,16,19,19.86,23,27];
let QR=null;

// ---------- palette (a small crayon box) ----------
const INK='#26357A',PAPER='#EFEADC',GREEN='#3E9E4A',TEAL='#2A9D8F',ORANGE='#F08A24',YELLOW='#F2C230',
      RED='#D8382F',BROWN='#7A4A2A',SKIN='#F0B48A',BLUE='#4A78D0',SKY='#9CC7E8',CREAM='#FBF3DF',DENIM='#33457A',PINK='#E77FA0',GRASS='#9CC25A';

// ---------- seeded noise ----------
function hash(a,b,c){let h=Math.imul((a|0)+0x632BE5AB,0x9E3779B1)^Math.imul((b|0)+0x1B873593,0x85EBCA77)^Math.imul((c|0)+0x7F4A7C15,0xC2B2AE3D);
  h^=h>>>15;h=Math.imul(h,0x2C1B3C6D);h^=h>>>12;h=Math.imul(h,0x297A2D39);h^=h>>>15;return (h>>>0)/4294967296;}
let B=0; // boil index (line boil on 10 fps)
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=x=>{x=clamp(x);return x*x*(3-2*x);};
const U=(t,p)=>clamp(Spring.unit(t,p),0,1.5);
let FACEBOX=[];

// ---------- point helpers ----------
function ell(cx,cy,rx,ry,n,rot=0){n=n||Math.max(14,Math.round((rx+ry)/9));const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const x=Math.cos(a)*rx,y=Math.sin(a)*ry;p.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)]);}return p;}
function resample(pts,closed,step=16){const out=[];const n=pts.length;const m=closed?n:n-1;
  for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%n];const d=Math.hypot(b[0]-a[0],b[1]-a[1]);const k=Math.max(1,Math.ceil(d/step));
    for(let j=0;j<k;j++)out.push([a[0]+(b[0]-a[0])*j/k,a[1]+(b[1]-a[1])*j/k]);}
  if(!closed)out.push(pts[n-1]);return out;}
function rrectPts(x,y,w,h,r){const p=[];const seg=6;const cs=[[x+w-r,y+r,-Math.PI/2],[x+w-r,y+h-r,0],[x+r,y+h-r,Math.PI/2],[x+r,y+r,Math.PI]];
  for(const [cx,cy,a0] of cs)for(let i=0;i<=seg;i++){const a=a0+i/seg*Math.PI/2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return p;}
function jit(pts,seed,amp){return pts.map((p,i)=>[p[0]+(hash(seed,i,B)-.5)*amp+Math.sin(i*.7+seed)*amp*.35,p[1]+(hash(seed,i+999,B)-.5)*amp+Math.cos(i*.5+seed)*amp*.35]);}
function smooth(pts,closed){g.beginPath();const n=pts.length;if(n<2)return;
  if(closed){const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let s=m(pts[n-1],pts[0]);g.moveTo(s[0],s[1]);
    for(let i=0;i<n;i++){const q=m(pts[i],pts[(i+1)%n]);g.quadraticCurveTo(pts[i][0],pts[i][1],q[0],q[1]);}g.closePath();}
  else{g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<n-1;i++){const q=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2];g.quadraticCurveTo(pts[i][0],pts[i][1],q[0],q[1]);}g.lineTo(pts[n-1][0],pts[n-1][1]);}}

// ---------- ballpoint ink ----------
function ink(pts,closed,seed,w=4,col=INK,amp=3){const r=resample(pts,closed,18);
  g.save();g.strokeStyle=col;g.lineCap='round';g.lineJoin='round';g.lineWidth=w;const A0=g.globalAlpha;g.globalAlpha=.92*A0;smooth(jit(r,seed,amp),closed);g.stroke();
  if(hash(seed,77,B)>.45){g.globalAlpha=.4*A0;g.lineWidth=w*.7;smooth(jit(r,seed+31,amp*1.4),closed);g.stroke();}g.restore();}

// ---------- crayon (waxy pattern, scribbled past the line) ----------
const PAT={};
function grain(col){if(PAT[col])return PAT[col];const s=192,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');
  x.fillStyle=col;x.fillRect(0,0,s,s);const d=x.getImageData(0,0,s,s);
  for(let i=0;i<s*s;i++){const n=hash(i,7,3),n2=hash(i>>3,(i%s)>>2,11);let a=.55+.45*n*.6+.4*n2;if(n<.07)a=.08;d.data[i*4+3]=Math.round(255*clamp(a));}
  x.putImageData(d,0,0);return PAT[col]=g.createPattern(cv,'repeat');}
function crayon(pts,col,seed,o={}){const ang=(o.ang??-0.5)+(hash(seed,5,B)-.5)*.06,gap=o.gap??11,w=o.w??13,al=o.alpha??.88,over=o.over??5;
  let cx=0,cy=0;for(const p of pts){cx+=p[0];cy+=p[1];}cx/=pts.length;cy/=pts.length;
  let R=0;for(const p of pts)R=Math.max(R,Math.hypot(p[0]-cx,p[1]-cy));
  const ex=pts.map(p=>{const d=Math.hypot(p[0]-cx,p[1]-cy)||1;return [p[0]+(p[0]-cx)/d*over,p[1]+(p[1]-cy)/d*over];});
  g.save();smooth(jit(resample(ex,true,22),seed,7),true);g.clip();
  g.strokeStyle=grain(col);g.lineWidth=w;g.lineCap='round';g.globalAlpha=al*g.globalAlpha;
  const dx=Math.cos(ang),dy=Math.sin(ang),px=-dy,py=dx;let k=0;
  for(let d=-R-gap;d<=R+gap;d+=gap,k++){if(hash(seed,k,B>>1)<(o.skip??.04))continue;
    const ox=cx+px*d,oy=cy+py*d,L=R+20;const wob=(hash(seed,k+50,B)-.5)*gap*.7;
    g.beginPath();g.moveTo(ox-dx*L,oy-dy*L+wob);g.quadraticCurveTo(ox+px*wob,oy+py*wob,ox+dx*L,oy+dy*L-wob);g.stroke();}
  g.restore();}
function shape(pts,col,seed,o={}){if(o.solid!==false){g.save();smooth(jit(resample(pts,true,22),seed+1,3),true);g.fillStyle=o.base||PAPER;g.fill();g.restore();}crayon(pts,col,seed,o);if(o.line!==false)ink(pts,true,seed+1,o.lw??4);}
function crayLine(pts,col,w,seed,al=.9){g.save();g.strokeStyle=grain(col);g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.globalAlpha=al*g.globalAlpha;smooth(jit(resample(pts,false,18),seed,3),false);g.stroke();g.restore();}

// ---------- text ----------
function hand(txt,x,y,size,col=INK,align='center',font='Gochi'){g.save();g.font=`${font==='Gochi'?'':'700 '}${size}px ${font}`;g.textAlign=align;g.textBaseline='alphabetic';
  g.fillStyle=col;g.translate(x,y);g.rotate((hash(txt.length,size,B>>1)-.5)*.012);g.fillText(txt,0,0);g.restore();}
// caption block: lines [{s, size, col, at}] rising into place, fading out at t1
function caption(t,lines,y0,t1,o={}){let y=y0;const out=t1?clamp((t1-t)/.18):1;
  for(const L of lines){const p=L.at<=0?1:U(t-L.at,'snappy');const a=L.at<=0?out:Math.min(clamp((t-L.at)/.12),out);
    y+=L.size*1.02;if(a<=0){y+=L.gap??10;continue;}
    g.save();g.globalAlpha=a;g.beginPath();g.rect(0,y-L.size*1.1,W,L.size*1.6);g.clip();
    hand(L.s,o.x??W/2,y+(1-p)*L.size*.9,L.size,L.col||INK,o.align||'center',L.font||'Gochi');g.restore();y+=L.gap??10;}}

// ---------- backgrounds ----------
function paper(){g.fillStyle=PAPER;g.fillRect(0,0,W,H);}
function sky(y1,seed){crayon([[-40,-40],[W+40,-40],[W+40,y1],[-40,y1]],SKY,seed,{ang:-.35,gap:16,w:22,alpha:.45,skip:.1,over:0});}
function ground(y0,col,seed){crayon([[-40,y0],[W+40,y0-10],[W+40,H+40],[-40,H+40]],col,seed,{ang:.25,gap:15,w:22,alpha:.6,skip:.08,over:0});
  ink([[-20,y0+4],[W/2,y0-6],[W+20,y0-8]],false,seed+3,3.5);}
function sun(x,y,r,t){g.save();g.strokeStyle=grain(ORANGE);g.lineWidth=11;g.lineCap='round';g.globalAlpha=.85;g.beginPath();
  for(let i=0;i<=120;i++){const a=i/120*Math.PI*2*3.2+t*.3,rr=r*i/120;
    const px=x+Math.cos(a)*rr+(hash(i,1,B)-.5)*4,py=y+Math.sin(a)*rr+(hash(i,2,B)-.5)*4;i?g.lineTo(px,py):g.moveTo(px,py);}
  g.stroke();g.restore();}
function cloud(x,y,s,seed){const p=[];for(let i=0;i<22;i++){const a=i/22*Math.PI*2;const r=s*(1+.18*Math.sin(a*5+seed));p.push([x+Math.cos(a)*r*1.6,y+Math.sin(a)*r*.7]);}
  crayon(p,'#FFFFFF',seed,{alpha:.75,gap:12});ink(p,true,seed+2,3);}
function ferris(x,y,r,t,seed){ink(ell(x,y,r,r,40),true,seed,4);ink(ell(x,y,r*.12,r*.12),true,seed+1,3);
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2+t*.12;ink([[x,y],[x+Math.cos(a)*r,y+Math.sin(a)*r]],false,seed+10+i,2.5);
    const cx=x+Math.cos(a)*r,cy=y+Math.sin(a)*r+r*.12;shape(rrectPts(cx-r*.1,cy-r*.07,r*.2,r*.15,6),[RED,YELLOW,TEAL,ORANGE][i%4],seed+20+i,{gap:8,w:9,lw:3});}
  ink([[x,y],[x-r*.55,y+r*1.25]],false,seed+40,4);ink([[x,y],[x+r*.55,y+r*1.25]],false,seed+41,4);}
function tent(x,y,w,h,col,seed){const p=[[x-w/2,y],[x+w/2,y],[x+w/2,y-h*.55],[x,y-h],[x-w/2,y-h*.55]];
  crayon(p,CREAM,seed,{gap:10});for(let i=0;i<4;i++){const sx=x-w/2+w*(i+.25)/4;crayon([[sx,y],[sx+w/8,y],[x+(sx-x)*.15+w*.03,y-h*.95],[x+(sx-x)*.15,y-h*.95]],col,seed+i+5,{gap:9,w:11,over:2});}
  ink(p,true,seed+1,4);ink([[x,y-h],[x,y-h-h*.25]],false,seed+9,3);crayon([[x,y-h-h*.25],[x+h*.2,y-h-h*.2],[x,y-h-h*.13]],RED,seed+10,{gap:6,w:7});}
function fairground(t,seed,horizon){sky(horizon+40,seed);cloud(860,590,55,seed+4);
  ferris(250,horizon-330,250,t,seed+50);tent(760,horizon+10,300,330,RED,seed+80);tent(1010,horizon+10,240,260,TEAL,seed+90);
  ground(horizon,GRASS,seed+7);}

// ---------- characters ----------
// o: {x,y feet, h height, kid, face(-1..1 turn), shirt, pants, hair, hairStyle, mood, run(phase|null), aL,aR (arm angles, 0=down, + = out), kneel, seed, squash, eye}
function person(o){const h=o.h,kid=!!o.kid,s=o.seed|0,sq=o.squash||1;const x=o.x,y=o.y;
  const hr=h*(kid?.17:.105);const kneel=o.kneel||0;
  const legL=h*(kid?.34:.43)*(1-kneel*.42);const hipY=y-legL;const torsoH=h*(kid?.3:.36)*sq;const shY=hipY-torsoH;const hy=shY-hr*.92;
  const tw=h*(kid?.26:.25);const turn=o.face||0;
  // legs
  const run=o.run;const legs=[[-1,0],[1,Math.PI]];
  for(const [side,ph] of legs){let a=run!=null?Math.sin(run+ph)*.55:side*.08;if(o.legsTuck)a=.75+side*.2;
    let fx=x+side*tw*.18+Math.sin(a)*legL,fy=hipY+Math.cos(a)*legL;
    if(kneel>0&&side===1){fx=x+tw*.55;fy=y;}
    const kx=kneel>0&&side===1?x+tw*.6:(x+side*tw*.18+fx)/2,ky=kneel>0&&side===1?hipY+legL*.1:(hipY+fy)/2;
    const lp=[[x+side*tw*.18,hipY],[kx,ky],[fx,fy]];
    crayLine(lp,o.pants||DENIM,h*(kid?.075:.07),s+side*3);ink(lp,false,s+side*7,3.2);
    shape(ell(fx+(o.dir||1)*h*.025,fy-h*.012,h*.045,h*.022),INK,s+side*11,{gap:6,w:7,lw:2.5});}
  // arms
  const armLen=h*(kid?.27:.34);const hands=[];
  for(const [side,ang] of (o.noArms?[]:[[-1,o.aL??.15],[1,o.aR??.15]])){const sx=x+side*tw*.42,sy=shY+h*.03;
    const a=ang;const ex=sx+side*Math.sin(a)*armLen*.5,ey=sy+Math.cos(a)*armLen*.5;const hx=sx+side*Math.sin(a*1.1)*armLen,hy2=sy+Math.cos(a*1.1)*armLen;
    const ap=[[sx,sy],[ex,ey],[hx,hy2]];crayLine(ap,o.shirt,h*(kid?.07:.06),s+side*13);ink(ap,false,s+side*17,3);
    shape(ell(hx,hy2,h*.03,h*.03),SKIN,s+side*19,{gap:6,w:7,lw:2.5});hands.push([hx,hy2]);}
  // torso
  const tp=[[x-tw*.42,shY],[x+tw*.42,shY],[x+tw*.5,hipY+4],[x-tw*.5,hipY+4]];
  shape(tp,o.shirt,s+23,{gap:10,w:12});
  if(o.vest){crayon([[x-tw*.42,shY],[x-tw*.12,shY],[x-tw*.16,hipY],[x-tw*.5,hipY]],YELLOW,s+25,{gap:8,w:10});crayon([[x+tw*.42,shY],[x+tw*.12,shY],[x+tw*.16,hipY],[x+tw*.5,hipY]],YELLOW,s+26,{gap:8,w:10});}
  if(o.dino){const dx=x+turn*tw*.08,dy=(shY+hipY)/2;shape(ell(dx,dy,tw*.18,tw*.14),CREAM,s+27,{gap:6,w:7,lw:2.5});
    shape(ell(dx-tw*.2,dy-tw*.12,tw*.09,tw*.07),CREAM,s+28,{gap:5,w:6,lw:2.5});
    for(let i=0;i<3;i++)for(let j=0;j<3;j++)if((i+j*2)%3!==1){g.fillStyle=INK;g.fillRect(dx-tw*.1+i*tw*.07,dy-tw*.08+j*tw*.06,tw*.05,tw*.045);}}
  // head
  const hx=x+turn*hr*.15;const hY=hy;
  if(o.hairStyle==='pig'){shape(ell(hx-hr*1.05,hY-hr*.1,hr*.32,hr*.4),BROWN,s+30,{gap:6,w:8,lw:3});shape(ell(hx+hr*1.05,hY-hr*.1,hr*.32,hr*.4),BROWN,s+31,{gap:6,w:8,lw:3});}
  shape(ell(hx,hY,hr,hr*1.02),SKIN,s+33,{gap:8,w:10});
  const hairCol=o.hair||BROWN;
  if(o.hairStyle==='cap'){shape([[hx-hr*1.02,hY-hr*.2],[hx-hr*.8,hY-hr*.85],[hx,hY-hr*1.1],[hx+hr*.8,hY-hr*.85],[hx+hr*1.02,hY-hr*.2]],RED,s+35,{gap:7,w:9});
    shape([[hx+turn*hr*.2-hr*.2,hY-hr*.3],[hx+turn*hr*.2+hr*1.35*(turn>=0?1:-1),hY-hr*.28],[hx+turn*hr*.2+hr*1.3*(turn>=0?1:-1),hY-hr*.12],[hx,hY-hr*.15]],RED,s+36,{gap:6,w:8});}
  else{shape([[hx-hr*1.0,hY-hr*.05],[hx-hr*.85,hY-hr*.75],[hx-hr*.3,hY-hr*1.08],[hx+hr*.4,hY-hr*1.08],[hx+hr*.9,hY-hr*.7],[hx+hr*1.0,hY-hr*.1],[hx+hr*.5,hY-hr*.55],[hx-hr*.4,hY-hr*.5]],hairCol,s+37,{gap:7,w:9});}
  // face
  const mood=o.mood||'happy';const ex=hx+turn*hr*.32;const ey=hY+hr*.1;const big=mood==='worried'||mood==='shock'?1.6:1;const er=hr*.1*big;
  for(const side of [-1,1]){const cx2=ex+side*hr*.36;if(big>1){g.fillStyle='#fff';g.beginPath();g.arc(cx2,ey,er*1.5,0,7);g.fill();ink(ell(cx2,ey,er*1.5,er*1.5,12),true,s+40+side,2.2);}
    g.fillStyle=INK;g.beginPath();g.arc(cx2+(o.look||0)*er*.6,ey,er,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(cx2+(o.look||0)*er*.6+er*.35,ey-er*.35,er*.35,0,7);g.fill();}
  const my=hY+hr*.55,mw=hr*.32;
  if(mood==='happy')ink([[ex-mw,my-hr*.05],[ex,my+hr*.12],[ex+mw,my-hr*.05]],false,s+45,3);
  else if(mood==='joy'){shape([[ex-mw*1.1,my-hr*.08],[ex+mw*1.1,my-hr*.08],[ex,my+hr*.25]],RED,s+46,{gap:5,w:6,lw:3});}
  else if(mood==='sad'){const q=[];for(let i=0;i<=6;i++)q.push([ex-mw+i*mw/3,my+hr*.08-(i%2)*hr*.07-Math.sin(i/6*Math.PI)*-hr*.0]);ink(q,false,s+47,3);
    const tt=((o.tear||0)%1);shape(ell(ex-hr*.4,ey+hr*.25+tt*hr*.6,hr*.07,hr*.1),SKY,s+48,{gap:4,w:5,lw:2});}
  else if(mood==='shock')ink(ell(ex,my+hr*.04,hr*.12,hr*.15,10),true,s+49,3);
  else ink([[ex-mw*.8,my+hr*.05],[ex+mw*.8,my+hr*.02]],false,s+50,3);
  if(o.blush){crayon(ell(ex-hr*.62,ey+hr*.32,hr*.16,hr*.09),RED,s+51,{gap:5,w:6,alpha:.4,over:0});crayon(ell(ex+hr*.62,ey+hr*.32,hr*.16,hr*.09),RED,s+52,{gap:5,w:6,alpha:.4,over:0});}
  FACEBOX.push([hx-hr*1.1,hY-hr*1.1,hr*2.2,hr*2.2]);
  return {hands,head:[hx,hY,hr],shY,hipY};}

function balloon(x,y,r,seed,sx,sy){ink([[x,y+r*1.2],[x+(sx-x)*.3+10,y+r*1.2+(sy-y-r*1.2)*.4],[x+(sx-x)*.7-10,y+r*1.2+(sy-y-r*1.2)*.75],[sx,sy]],false,seed,2.5);
  shape([...ell(x,y,r*.85,r,20)],RED,seed+1,{gap:7,w:9});shape([[x-7,y+r*.98],[x+7,y+r*.98],[x,y+r*1.18]],RED,seed+2,{gap:4,w:5,lw:2});
  g.save();g.globalAlpha=.7;crayLine([[x-r*.4,y-r*.4],[x-r*.25,y-r*.6]],'#FFFFFF',8,seed+3);g.restore();}
function heart(x,y,s,seed,col=RED){const p=[];for(let i=0;i<28;i++){const a=i/28*Math.PI*2;const hx=16*Math.pow(Math.sin(a),3),hy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));p.push([x+hx*s/16,y+hy*s/16]);}shape(p,col,seed,{gap:5,w:7,lw:3});}

// ---------- the QR (the one crisp thing) ----------
function drawQR(x,y,S,lit){const n=QR.length,m=S/n;g.save();
  for(let r=0;r<n;r++)for(let k=0;k<n;k++){if(QR[r][k]!=='1')continue;const L=lit?lit(r,k):0;
    g.fillStyle=L>0?mix('#1E2A5E','#FFC21A',L):'#1E2A5E';g.fillRect(x+k*m-.4,y+r*m-.4,m+.8,m+.8);}
  g.restore();}
function mix(a,b,t){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),Bq=p(b);return `rgb(${A.map((v,i)=>Math.round(v+(Bq[i]-v)*t)).join(',')})`;}
// a printed design: QR square at (x,y,S) dressed as a creature
function design(kind,x,y,S,seed,lit){const q=S/25;
  if(kind==='dino'){for(let i=0;i<5;i++){const sx=x+S*(.08+i*.19);shape([[sx,y-q*2],[sx+S*.17,y-q*2],[sx+S*.085,y-q*2-S*.15]],ORANGE,seed+60+i,{gap:6,w:8,lw:3});}
    shape([[x+S*1.02,y+S*.62],[x+S*1.5,y+S*1.02],[x+S*1.4,y+S*1.08],[x+S*.98,y+S*1.0]],CREAM,seed+70,{gap:8,w:10});
    for(const lx of [.15,.68])shape(rrectPts(x+S*lx,y+S*1.0,S*.17,S*.22,S*.05),CREAM,seed+72+lx*10,{gap:7,w:9});
    shape(rrectPts(x-q*2,y-q*2,S+q*4,S+q*4,S*.12),CREAM,seed+74,{gap:9,w:11,alpha:.95});
